@if (pageState() === 'success') {
  <app-novelty-result
    [noveltyName]="noveltyName"
    [contractNumber]="state.selectedContract()?.number ?? ''"
    [executedAt]="executedAt()"
    [responsible]="state.selectedContract()?.supervisor ?? ''"
    (back)="goBack()" />
} @else if (pageState() === 'error') {
  <app-novelty-error [noveltyName]="noveltyName" [error]="errorInfo()" (retry)="onRetry()" (back)="goBack()" />
} @else {
<app-novelty-page-layout
  title="Crear Acta de Novedad de Suspensión"
  [breadcrumbItems]="breadcrumb()"
  [contract]="state.selectedContract()"
  [error]="state.contractError()">

  <form [formGroup]="form" (ngSubmit)="onSubmit($event)" class="flex flex-col gap-stack-lg">

    <!-- Datos de la Solicitud -->
    <app-card title="Datos de la Solicitud" icon="folder_open">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
        <app-form-field label="Fecha de solicitud" for="fecha_solicitud" [control]="form.controls['fechaSolicitud']">
          <app-date-input inputId="fecha_solicitud" formControlName="fechaSolicitud" />
        </app-form-field>
        <app-form-field label="Fecha de expedición del acta" for="fecha_expedicion" [control]="form.controls['fechaExpedicionActa']">
          <app-date-input inputId="fecha_expedicion" formControlName="fechaExpedicionActa" />
        </app-form-field>
        <app-form-field label="Número oficio supervisor a ordenador" for="num_oficio_sup" [required]="true" [control]="form.controls['numOficioSupervisor']">
          <input appFormInput id="num_oficio_sup" type="text" placeholder="Ej. 123" formControlName="numOficioSupervisor">
        </app-form-field>
        <app-form-field label="Fecha oficio supervisor a ordenador" for="fecha_oficio_sup" [control]="form.controls['fechaOficioSupervisor']">
          <app-date-input inputId="fecha_oficio_sup" formControlName="fechaOficioSupervisor" />
        </app-form-field>
        <app-form-field label="Número oficio ordenador a OC" for="num_oficio_ord" [required]="true" [control]="form.controls['numOficioOrdenador']">
          <input appFormInput id="num_oficio_ord" type="text" placeholder="Ej. 124" formControlName="numOficioOrdenador">
        </app-form-field>
        <app-form-field label="Fecha oficio ordenador a OC" for="fecha_oficio_ord" [control]="form.controls['fechaOficioOrdenador']">
          <app-date-input inputId="fecha_oficio_ord" formControlName="fechaOficioOrdenador" />
        </app-form-field>
      </div>
    </app-card>

    <!-- Configuración de la Novedad -->
    <app-card title="Configuración de la Novedad" icon="settings_applications">
      <div class="flex flex-col gap-stack-lg">

        <!-- Datos de la suspensión -->
        <div class="border border-outline-variant/30 rounded-lg p-4 flex flex-col gap-stack-md">
          <div class="flex items-center gap-3">
            <mat-icon class="text-primary flex items-center justify-center">pause_circle</mat-icon>
            <span class="font-title-md text-title-md text-on-surface">Datos de la suspensión</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
            <app-form-field label="Fecha inicio suspensión" for="fecha_inicio" [required]="true" [control]="form.controls['fechaInicio']">
              <app-date-input inputId="fecha_inicio" [min]="minFechaInicio()" formControlName="fechaInicio" />
            </app-form-field>
            <app-form-field label="Fecha fin suspensión" for="fecha_fin" [required]="true" [control]="form.controls['fechaFin']">
              <app-date-input inputId="fecha_fin" [min]="minFechaFin" [max]="maxFechaFin()" formControlName="fechaFin" />
            </app-form-field>
            <app-form-field label="Periodo suspensión (Días)" for="periodo_suspension">
              <input appFormInput id="periodo_suspension" type="number" formControlName="periodoDias">
            </app-form-field>
            <app-form-field label="Fecha reinicio" for="fecha_reinicio">
              <app-date-input inputId="fecha_reinicio" formControlName="fechaReinicio" />
            </app-form-field>
            <div class="md:col-span-2">
              <app-form-field label="Motivo de suspensión" for="motivo" [required]="true" [control]="form.controls['motivo']">
                <textarea appFormInput id="motivo" rows="4" maxlength="249" placeholder="Redacte aquí el motivo de la suspensión..." formControlName="motivo"></textarea>
              </app-form-field>
            </div>
          </div>
        </div>

        <!-- Cláusula Adicional -->
        <app-additional-clause-section [group]="clausula" />

        <app-document-preview-control
          [(fontSize)]="tamanoLetra"
          [loading]="previsualizando()"
          [error]="previewError()"
          (preview)="previsualizarActa()" />
      </div>
    </app-card>

    <app-novelty-form-actions [submitting]="submitting()" (clear)="onClear()" />
  </form>

  @if (showConfirm()) {
    <app-confirm-novelty-modal
      noveltyLabel="suspensión"
      [contractNumber]="state.selectedContract()?.number ?? ''"
      [year]="year()"
      [summary]="summary()"
      [submitting]="submitting()"
      (confirm)="onConfirm()"
      (dismiss)="closeConfirm()" />
  }
</app-novelty-page-layout>
}
